<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#64bc46">
    <title>Syncloud - your own apps on your own server at home</title>
    <meta name="author" content="syncloud.org">
    <meta name="description" content="Run Nextcloud, media, photos and a password manager on hardware you own. Syncloud installs and updates them for you, with HTTPS and a domain name included.">
    <link rel="canonical" href="https://syncloud.org/">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('syncloud-theme')
          var dark = saved === 'dark' || (!saved && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but this site doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
