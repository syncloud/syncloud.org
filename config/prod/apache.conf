<VirtualHost *:443>
    ServerName syncloud.org
    ServerAlias www.syncloud.org
    DocumentRoot /var/www/syncloud.org/current

    Alias /.well-known /var/www/syncloud.org/.well-known
    <Directory /var/www/syncloud.org/.well-known>
        Require all granted
    </Directory>

    <Directory /var/www/syncloud.org/current>
        Require all granted
        Options -Indexes
        FallbackResource /index.html
    </Directory>

    SSLEngine on
    SSLCertificateFile "/etc/letsencrypt/live/syncloud.org/cert.pem"
    SSLCertificateChainFile "/etc/letsencrypt/live/syncloud.org/chain.pem"
    SSLCertificateKeyFile "/etc/letsencrypt/live/syncloud.org/privkey.pem"
</VirtualHost>

<VirtualHost *:80>
    ServerName syncloud.org
    ServerAlias www.syncloud.org
    DocumentRoot /var/www/syncloud.org/current

    Alias /.well-known /var/www/syncloud.org/.well-known
    <Directory /var/www/syncloud.org/.well-known>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known
    RewriteRule ^ https://syncloud.org%{REQUEST_URI} [L,R=301]
</VirtualHost>
